services:
  caddy:
    cap_add:
      - NET_ADMIN
    image: $CONTAINER_REGISTRY/sderickson-caddy:latest
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - ./env.caddy
      # BEGIN WORKFLOW AREA env-caddy FOR product/init
      # END WORKFLOW AREA
    environment:
      - DISABLE_VITE_DEV_SERVER=#
    volumes:
      - ./config:/etc/caddy/
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  monolith:
    image: $CONTAINER_REGISTRY/sderickson-hub-monolith:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    memswap_limit: 2G
    volumes:
      - /opt/hub/cron:/app/hub/service/cron/data
      - /opt/hub/db:/app/hub/service/db/data
      - /opt/hub/identity:/app/hub/service/identity/data
      - /opt/hub/identity-http:/app/saflib/identity/identity-http/data
      - /opt/recipes/cron:/app/recipes/service/cron/data
      - /opt/recipes/db:/app/recipes/service/db/data
      - /opt/recipes/common/data:/app/recipes/service/common/data

    build:
      context: ../..
      dockerfile: hub/service/monolith/Dockerfile

    env_file:
      - ./env.monolith.config
      - ./.env.monolith.secrets

  # BEGIN WORKFLOW AREA monolith FOR product/init
  # END WORKFLOW AREA

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - /opt/kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

  kratos:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    env_file:
      - ./env.kratos.config
      - ./.env.kratos.secrets
    volumes:
      - /opt/kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
