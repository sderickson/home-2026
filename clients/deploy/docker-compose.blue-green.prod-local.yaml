# Blog and resume's blue-green services for `saf-deploy up --local`, run beside a
# prod-local stack (`npm run prod-local`): prod-local env files instead of
# production's.
services:
  clients-web:
    extends:
      file: remote-assets/docker-compose.blue-green.yaml
      service: clients-web
    env_file: !override
      - ./env.web.prod-local

networks:
  edge:
    name: sderickson-edge
    external: true
