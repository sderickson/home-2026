# Blog/resume stack, locally. Start hub/deploy's prod-local first (it owns the
# edge network and Caddy); `npm run prod-local` then registers the routes there.
# Own project name: every deploy folder is called deploy, which would put all
# the local stacks in one compose project.
name: clients-prod-local
services:
  clients-web:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: clients-web
    env_file: !override
      - ./env.web.prod-local

networks:
  edge:
    name: sderickson-edge
    external: true
