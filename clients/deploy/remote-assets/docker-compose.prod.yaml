# Blog and resume deploy. Requires the platform deploy (hub/deploy): joins its
# edge network and registers caddy/clients.Caddyfile with its edge.
services:
  clients-web:
    image: $CONTAINER_REGISTRY/sderickson-clients-deploy-web:latest
    restart: unless-stopped
    env_file:
      - ./env.web
    networks:
      - edge

networks:
  edge:
    name: sderickson-edge
    external: true
