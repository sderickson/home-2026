# Cap each container's Docker log (json-file is unbounded by default and
# lives on the boot disk under /var/lib/docker): 3 x 10 MB, rotated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The product's deploy. Requires the platform deploy (deploy/): joins its edge
# network, uses its Kratos, and registers caddy/notebook.Caddyfile with
# its edge (`saf-deploy up`).
services:
  notebook-monolith:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/sderickson-notebook-monolith:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    memswap_limit: 2G
    volumes:
      - /opt/notebook/cron:/app/notebook/service/cron/data
      - /opt/notebook/db:/app/notebook/service/db/data
      - /opt/notebook/identity:/app/notebook/service/identity/data
      - /opt/notebook/identity-http:/app/saflib/identity/identity-http/data
    env_file:
      - ./.env.notebook.secrets
    networks:
      - edge

  notebook-web:
    logging: *default-logging
    image: $CONTAINER_REGISTRY/sderickson-notebook-deploy-web:latest
    restart: unless-stopped
    env_file:
      - ./env.web
    networks:
      - edge

networks:
  edge:
    name: sderickson-edge
    external: true
