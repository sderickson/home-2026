# Notebook services deployed blue-green (`saf-deploy up`): each runs as
# notebook-blue or notebook-green, and the edge routes to the live color's
# containers (`<service>-${SAF_COLOR}`, see caddy/notebook.Caddyfile). A new
# color must pass its healthcheck before routes switch to it.
services:
  notebook-monolith:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: $CONTAINER_REGISTRY/sderickson-notebook-monolith:latest
    container_name: notebook-monolith-${SAF_COLOR:-blue}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    memswap_limit: 2G
    volumes:
      - /opt/notebook/cron:/app/notebook/service/cron/data
      - /opt/notebook/db:/app/notebook/service/db/data
      - /opt/notebook/identity:/app/notebook/service/identity/data
      - /opt/notebook/identity-http:/app/saflib/identity/identity-http/data
    env_file:
      - ./.env.notebook.secrets
    # The old color gets SIGTERM; in-flight requests and jobs get time to finish.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - edge

  notebook-web:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: $CONTAINER_REGISTRY/sderickson-notebook-deploy-web:latest
    container_name: notebook-web-${SAF_COLOR:-blue}
    restart: unless-stopped
    env_file:
      - ./env.web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - edge

networks:
  edge:
    name: sderickson-edge
    external: true
