# Notebook services deployed blue-green (`saf-deploy up`): each runs as
# notebook-blue or notebook-green, and the edge routes to the live color's
# containers (`<service>-${SAF_COLOR}`, see caddy/notebook.Caddyfile). A new
# color must pass its healthcheck before routes switch to it.
services:
  notebook-web:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: $CONTAINER_REGISTRY/sderickson-notebook-deploy-web:latest
    container_name: notebook-web-${SAF_COLOR:-blue}
    restart: unless-stopped
    env_file:
      - ./env.web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - edge

networks:
  edge:
    name: sderickson-edge
    external: true
