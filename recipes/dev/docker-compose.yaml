name: sderickson-recipes-dev

services:
  caddy:
    depends_on:
      - recipes-clients
    image: sderickson-recipes-dev:latest
    build:
      context: ../..
      dockerfile: ./recipes/dev/Dockerfile
    env_file:
      - ./env.caddy
    ports:
      - 80:80
    # The dev-site runs as its own stack (`npm run dev-site`) on host port 3099.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy-config:/etc/caddy/
      - caddy_data:/data
      - caddy_config:/config

  # Installs node_modules into the shared volume when the lockfile changed
  # (no image rebuild needed), then exits. The Node services wait for it.
  deps:
    image: sderickson-recipes-dev-node:latest
    build:
      context: ../..
      dockerfile: ./recipes/dev/builds/node/Dockerfile
    command:
      - node
      - --experimental-strip-types
      - --disable-warning=ExperimentalWarning
      - /app/saflib/docker/dev/install-node-modules.ts
    volumes: &node-volumes
      # Source is bind-mounted; node_modules stays in Linux-only named volumes
      # (the host's macOS builds would shadow them otherwise). saflib's own
      # node_modules is for developing it standalone, so it's masked too.
      - ../..:/app
      - node_modules:/app/node_modules
      - saflib_node_modules:/app/saflib/node_modules
      - npm_cache:/root/.npm

  recipes-clients:
    image: sderickson-recipes-dev-node:latest
    depends_on:
      deps:
        condition: service_completed_successfully
    working_dir: /app/recipes/clients/build
    environment:
      - CLIENT_SUBDOMAINS=recipes,app.recipes,admin.recipes,account.recipes
      - DOMAIN=docker.localhost
      - DEPLOYMENT_NAME=${DEPLOYMENT_NAME}
      - PROTOCOL=${PROTOCOL}
      - SERVICE_SUBDOMAINS=api.recipes
      - TZ=${TZ}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
    volumes: *node-volumes
    command: npm run dev

  monolith:
    image: sderickson-recipes-dev-node:latest
    depends_on:
      deps:
        condition: service_completed_successfully
    working_dir: /app/recipes/service/monolith
    # Restarts when any file it imports changes (service code and saflib alike).
    command:
      - node
      - --watch
      - --experimental-strip-types
      - --disable-warning=ExperimentalWarning
      - ./run.ts
    volumes: *node-volumes
    env_file:
      - ./env.dev
      - ./.env

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/kratos migrate sql -e --yes > /tmp/kratos-migrate.log 2>&1
        status=$$?
        if [ $$status -ne 0 ]; then
          cat /tmp/kratos-migrate.log >&2
          exit $$status
        fi
        echo "kratos-migrate: ok"
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
      - LOG_LEVEL=warn
    volumes:
      - kratos_home:/home/ory
      - ./kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

  kratos:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc&_journal_mode=WAL&_busy_timeout=5000
    env_file:
      - ./env.kratos.config
    volumes:
      - kratos_home:/home/ory
      - ./kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

volumes:
  caddy_data:
  caddy_config:
  node_modules:
  saflib_node_modules:
  npm_cache:
  kratos_home:
