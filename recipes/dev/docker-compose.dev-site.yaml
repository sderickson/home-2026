name: sderickson-recipes-dev-site

# Standalone dev-site (built image only). UI + API at http://localhost:3099
services:
  site:
    image: saflib-dev-site:latest
    build:
      context: ../..
      dockerfile: saflib/dev-site/dev-site-docker/Dockerfile
    ports:
      - "3099:3099"
    environment:
      NODE_ENV: production
      TZ: UTC
      DEPLOYMENT_NAME: development
      DOMAIN: localhost
      PROTOCOL: http
      CLIENT_SUBDOMAINS: ""
      ADMIN_EMAILS: "sderickson@gmail.com"
      ALLOW_DB_CREATION: "true"
      DEV_SITE_SERVICE_HTTP_HOST: "0.0.0.0:3099"
      DEV_SITE_REPO_ROOT: /repo
      SAFLIB_ROOT: ${DEV_SITE_SAFLIB_ROOT:-/repo/saflib}
      DEV_SITE_PRODUCT_ROOT: ${DEV_SITE_PRODUCT_ROOT:-recipes}
      DEV_SITE_MAIN_REF: main
      DEV_SITE_DB_PATH: /data/dev-site.sqlite
      NEW_WORKFLOWS_DB_PATH: /data/new-workflows/local.sqlite
      DEV_SITE_PUBLIC_HTTP_URL: "http://localhost:3099/"
      DEV_SITE_GITHUB_REPO: sderickson/home-2026
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-}
      AGENT_CLI_CREDENTIAL_STORE: file
    volumes:
      - ${DEV_SITE_REPO_MOUNT:-../..}:/repo
      - repo_node_modules:/repo/node_modules
      - dev_site_data:/data
      - ${DEV_SITE_CLAUDE_CREDENTIALS:-./.claude-credentials.json}:/home/node/.claude/.credentials.json
      - ${DEV_SITE_CURSOR_AUTH:-./.cursor-auth.json}:/home/node/.config/cursor/auth.json

volumes:
  dev_site_data:
    name: sderickson-recipes-dev-site-data
  repo_node_modules:
    name: sderickson-recipes-dev-site-repo-node-modules
