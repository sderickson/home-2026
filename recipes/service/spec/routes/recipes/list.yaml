listRecipes:
  summary: "List recipes in a collection. Auth required; caller must be at least viewer on the collection."
  operationId: "listRecipes"
  security:
    - session: [email-verified]

  parameters:
    - name: collectionId
      in: query
      required: true
      schema:
        type: string
      description: Id of the collection to list recipes from.
    - name: archived
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: List archived recipes instead of active ones.
  responses:
    "400":
      description: "Bad request - collectionId is required."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
    "401":
      description: "Unauthorized - collection listing requires authentication."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
    "403":
      description: "Forbidden - not a member of the collection or insufficient role."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
    "422":
      description: "Unprocessable - collection does not exist (validation)."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
    "200":
      description: >
        Recipes in the collection, with their current versions and files, so
        list pages can render cards (key ingredients, first image) and search
        ingredients in one request.
      content:
        application/json:
          schema:
            type: object
            required:
              - recipes
              - currentVersions
              - files
            properties:
              recipes:
                type: array
                items:
                  $ref: "../../schemas/recipe.yaml"
              currentVersions:
                type: array
                description: "Current version of each recipe in `recipes` (match on recipeId)."
                items:
                  $ref: "../../schemas/recipe-version.yaml"
              files:
                type: array
                description: "Files for every recipe in `recipes` (match on recipeId); empty array when none."
                items:
                  $ref: "../../schemas/recipe-file-info.yaml"
