sharedFilesDownloadRecipes:
  summary: "Serve recipe file binary for the public share page (no auth)."
  description: >
    Public binary download for images and other attachments shown on the
    unauthenticated share page. Distinct from the authenticated
    GET /recipes/{id}/files/{fileId}/blob so the public surface stays explicit.
  operationId: "sharedFilesDownloadRecipes"
  x-public: true

  parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: string
      description: "Recipe id"
    - name: "fileId"
      in: "path"
      required: true
      schema:
        type: string
      description: "Recipe file id"

  responses:
    "200":
      description: "File binary content."
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary

    "404":
      description: "Not Found - recipe or file missing, or file does not belong to that recipe."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
