createRecipeVersion:
  summary: "Create a new recipe version (recorded history entry). Admin only."
  operationId: "createRecipeVersion"
  security:
    - session: [email-verified]
  # instructionsMarkdown may contain raw HTML; the handler sanitizes it and
  # rejects HTML in the other fields.
  tags:
    - "block-html-exempt"

  parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: string
      description: "Recipe id"

  requestBody:
    required: true
    description: "Content for the new version."
    content:
      application/json:
        schema:
          $ref: "../../schemas/recipe-version.yaml#/properties/content"

  responses:
    "200":
      description: "New RecipeVersion (set as latest)."
      content:
        application/json:
          schema:
            type: object
            required:
              - recipeVersion
              - removedHtml
            properties:
              recipeVersion:
                $ref: "../../schemas/recipe-version.yaml"
              removedHtml:
                type: array
                description: "Raw HTML removed from instructionsMarkdown when sanitizing. Empty when nothing was removed."
                items:
                  $ref: "../../schemas/html-removal.yaml"

    "400":
      description: "Bad request - HTML in a field other than instructionsMarkdown."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

    "401":
      description: "Unauthorized - missing or invalid auth headers, or not logged in."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

    "403":
      description: "Forbidden - user does not have required privileges (admin only)."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"

    "404":
      description: "Not Found"
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
