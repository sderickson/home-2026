sharedGetMenus:
  summary: "Load a menu for the public share page by id (no auth)."
  description: >
    Returns the menu, every recipe in its groupings, those recipes' current
    versions, and their files, so the public share page can render both the
    menu and diner layouts in one request. Each file's downloadUrl is set by the
    handler to the shared recipe blob path
    (/recipes/{recipeId}/shared/files/{fileId}/blob), not the authenticated
    blob path. Groupings only list recipes that still exist.
  operationId: "sharedGetMenus"
  tags:
    - "no-auth"

  parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: string
      description: "Menu id"

  responses:
    "200":
      description: "Menu with its recipes, their current versions, and files for the public share page."
      content:
        application/json:
          schema:
            type: object
            required:
              - menu
              - recipes
              - currentVersions
              - files
            properties:
              menu:
                $ref: "../../schemas/menu.yaml"
              recipes:
                type: array
                description: "Every recipe referenced in the menu's groupings."
                items:
                  $ref: "../../schemas/recipe.yaml"
              currentVersions:
                type: array
                description: "Current version of each recipe in `recipes` (match on recipeId)."
                items:
                  $ref: "../../schemas/recipe-version.yaml"
              files:
                type: array
                description: "Files for every recipe in `recipes` (match on recipeId); empty array when none. downloadUrl points at the shared recipe blob path."
                items:
                  $ref: "../../schemas/recipe-file-info.yaml"

    "404":
      description: "Not Found - no menu with that id."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
