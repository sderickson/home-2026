getMenus:
  summary: "Get one menu with groupings, plus every recipe in the menu with its current version and files. Auth required; caller must be at least viewer on the menu's collection. Query collectionId is required."
  operationId: "getMenu"
  security:
    - session: [email-verified]

  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Menu id.
    - name: collectionId
      in: query
      required: true
      schema:
        type: string
      description: Id of the collection (required for access).

  responses:
    "200":
      description: "Menu with groupings, and its recipes' current versions and files, enough to render the menu in one request."
      content:
        application/json:
          schema:
            type: object
            required:
              - menu
              - recipes
              - currentVersions
              - files
            properties:
              menu:
                $ref: "../../schemas/menu.yaml"
              recipes:
                type: array
                items:
                  $ref: "../../schemas/recipe.yaml"
                description: Full Recipe objects for every recipe referenced in the menu's groupings.
              currentVersions:
                type: array
                description: "Current version of each recipe in `recipes` (match on recipeId)."
                items:
                  $ref: "../../schemas/recipe-version.yaml"
              files:
                type: array
                description: "Files for every recipe in `recipes` (match on recipeId); empty array when none."
                items:
                  $ref: "../../schemas/recipe-file-info.yaml"
    "401":
      description: "Unauthorized - authentication required."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
    "403":
      description: "Forbidden - not a member of the collection or insufficient role."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
    "404":
      description: "Not found - menu does not exist."
      content:
        application/json:
          schema:
            $ref: "../../schemas/error.yaml"
