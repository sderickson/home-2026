    path: recipes/plans/notes/2026-10-14-recipe-share-links
  - kind: call-workflow
    workflowId: processes/spec-project
    input:
      name: recipe-share-links
      prompt: hey I want to add share links to this site. If you go to the recipe
        page, click the menu button, there should be a "get share link" there
