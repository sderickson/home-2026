name: Phase 2 — HTTP share handlers
description: >
  Implement public share handlers under handlers/recipes (current express/add-handler
  layout). Mount them with enforceAuth false beside the existing authenticated
  routes/recipes router. Shared GET must set downloadUrl to the shared blob path.
steps:
  - kind: cd
    path: recipes/service/http

  - kind: call-workflow
    workflowId: express/add-handler
    input:
      path: ./handlers/recipes/shared-get.ts
      prompt: >
        Read recipes/plans/notes/2026-10-14-recipe-share-links/recipe-share-links.spec.md
        (API Endpoints #1 and Authorization). Implement GET /recipes/{id}/shared.

        Important product layout notes:
        - This package historically keeps authenticated recipe handlers under
          routes/recipes/. express/add-handler scaffolds under handlers/recipes/ —
          keep the new public share handlers there and mount that router from http.ts
          (or routers.ts if created). Do not break or relocate routes/recipes/.
        - Mount share routes with enforceAuth: false and without
          emailVerificationRequired. Do not use getRecipeAndRequireCollectionAuth.
        - Anyone who knows the recipe id may load the payload; 404 if missing.

        Behavior:
        - Load recipe by id, current/latest version, and file list.
        - Response: { recipe, currentVersion, files } matching sharedGetRecipes.
        - files always present (possibly []). For each file, downloadUrl must be
          API base + /recipes/{id}/shared/files/{fileId}/blob — not the authenticated
          /files/{fileId}/blob path. Reuse/extend _helpers mappers as needed (e.g. a
          shared-downloadUrl variant of recipeFileToApiRecipeFile). Include
          unsplashAttribution when present.
        - Cover success and 404 in the generated test; no auth session required.

  - kind: call-workflow
    workflowId: express/add-handler
    input:
      path: ./handlers/recipes/shared-files-download.ts
      download: true
      prompt: >
        Read the share-links spec (API Endpoints #2). Implement GET
        /recipes/{id}/shared/files/{fileId}/blob — public binary serve.

        Same mounting rules as shared-get: public router, enforceAuth false, no
        collection membership check. Mirror files-download.ts blob streaming /
        Content-Type behavior, but authorize solely by recipe id + file belonging
        to that recipe. 404 if recipe missing, file missing, or file.recipeId
        mismatch. Do not call getRecipeAndRequireCollectionAuth.

        Tests: unauthenticated 200 for a real file on a recipe; 404 cases above.
        Authenticated blob route must remain unchanged.

  - kind: prompt
    prompt: >
      Confirm both share handlers are mounted on a public (enforceAuth: false) router
      reachable from createRecipesHttpApp, and that authenticated routes/recipes
      behavior is unchanged. If express/add-handler created routers.ts, wire it so
      platform terminators in http.ts still run after product routers. Then run
      npm run typecheck and npm run test in recipes/service/http and fix failures.

  - kind: command
    command: npm
    args: ["run", "typecheck"]

  - kind: command
    command: npm
    args: ["run", "test"]
