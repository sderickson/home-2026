# Recipes deploy. Requires the platform deploy (hub/deploy): joins its edge
# network, uses its Kratos, and registers caddy/recipes.Caddyfile with its edge.
services:
  recipes-monolith:
    image: $CONTAINER_REGISTRY/sderickson-recipes-monolith:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    memswap_limit: 2G
    volumes:
      - /opt/recipes/cron:/app/recipes/service/cron/data
      - /opt/recipes/db:/app/recipes/service/db/data
      - /opt/recipes/jobs:/app/recipes/service/jobs/data
      - /opt/recipes/common/data:/app/recipes/service/common/data
    build:
      context: ../../..
      dockerfile: recipes/service/monolith/Dockerfile
    env_file:
      - ./env.recipes.config
      - ./.env.recipes.secrets
    networks:
      - edge

  recipes-web:
    image: $CONTAINER_REGISTRY/sderickson-recipes-deploy-web:latest
    restart: unless-stopped
    env_file:
      - ./env.web
    networks:
      - edge

networks:
  edge:
    name: sderickson-edge
    external: true
