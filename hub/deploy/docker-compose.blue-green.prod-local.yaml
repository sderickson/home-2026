# Hub's blue-green services for `saf-deploy up --local`, run beside a
# prod-local stack (`npm run prod-local`): prod-local env files instead of
# production's.
services:
  hub-monolith:
    extends:
      file: remote-assets/docker-compose.blue-green.yaml
      service: hub-monolith
    volumes: !override []
    env_file: !override
      - ./env.monolith.prod-local

  hub-web:
    extends:
      file: remote-assets/docker-compose.blue-green.yaml
      service: hub-web
    env_file: !override
      - ./env.web.prod-local

networks:
  edge:
    name: sderickson-edge
    external: true
