# Platform stack, locally. Product prod-local stacks join its edge network and
# register their routes with `saf-deploy register-sites --local`.
services:
  caddy:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: caddy
    # Config comes from the image; only the product-routes volume is mounted.
    volumes: !override
      - caddy_sites:/etc/caddy/sites
    env_file: !override
      - ./env.caddy.prod-local

  monolith:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: monolith
    volumes: !override []
    env_file: !override
      - ./env.monolith.prod-local

  kratos-migrate:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: kratos-migrate
    volumes: !override
      - kratos_data:/var/lib/sqlite
      - ./kratos-prod-local:/etc/config/kratos

  kratos:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    env_file: !override
      - ./env.kratos.config.prod-local
      - ./env.kratos.prod-local
    volumes: !override
      - kratos_data:/var/lib/sqlite
      - ./kratos-prod-local:/etc/config/kratos

networks:
  edge:
    name: sderickson-edge

volumes:
  caddy_data:
  caddy_config:
  caddy_sites:
    name: sderickson-caddy-sites-prod-local
  kratos_data:
