# Platform stack, locally: the edge, Kratos and hub. Each product's prod-local
# includes this file; routes (hub's, Kratos's, the product's) are registered
# with `saf-deploy register-sites --local`.
# Own project name: every deploy folder is called deploy, which would put all
# the local stacks in one compose project.
name: hub-prod-local
services:
  caddy:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: caddy
    # Config comes from the image; only the routes volume is mounted.
    volumes: !override
      - caddy_sites:/etc/caddy/sites
    env_file: !override
      - ./env.caddy.prod-local

  hub-web:
    extends:
      file: remote-assets/docker-compose.blue-green.yaml
      service: hub-web
    env_file: !override
      - ./env.web.prod-local

  hub-monolith:
    extends:
      file: remote-assets/docker-compose.blue-green.yaml
      service: hub-monolith
    volumes: !override []
    env_file: !override
      - ./env.monolith.prod-local

  kratos-migrate:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: kratos-migrate
    volumes: !override
      - kratos_data:/var/lib/sqlite
      - ./kratos-prod-local:/etc/config/kratos

  kratos:
    extends:
      file: remote-assets/docker-compose.prod.yaml
      service: kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    env_file: !override
      - ./env.kratos.config.prod-local
      - ./env.kratos.prod-local
    volumes: !override
      - kratos_data:/var/lib/sqlite
      - ./kratos-prod-local:/etc/config/kratos

networks:
  edge:
    name: sderickson-edge

volumes:
  caddy_data:
  caddy_config:
  caddy_sites:
    name: sderickson-caddy-sites-prod-local
  kratos_data:
