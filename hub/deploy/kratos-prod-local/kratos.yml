version: v1.3.1

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc

serve:
  public:
    base_url: http://kratos.docker.localhost/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://auth.docker.localhost/

  # Same as recipes/dev: any HTTP origin on docker.localhost for local prod-like stacks.
  allowed_return_urls:
    - http://docker.localhost/
    - http://*.docker.localhost/

  flows:
    registration:
      enabled: true
      style: unified
      ui_url: http://auth.docker.localhost/registration

    login:
      ui_url: http://auth.docker.localhost/login

    recovery:
      enabled: true
      ui_url: http://auth.docker.localhost/recovery

    settings:
      ui_url: http://account.docker.localhost/settings

    logout:
      after:
        default_browser_return_url: http://auth.docker.localhost/

    verification:
      enabled: true
      ui_url: http://auth.docker.localhost/verification
      use: code

  methods:
    password:
      enabled: true
    # Off: passkeys are a second factor here (webauthn below), not a
    # password replacement. Both methods drive the same browser prompt.
    passkey:
      enabled: false
    totp:
      enabled: true
      config:
        issuer: Scott's Home Page (Hub Prod-Local)
    # Security key / passkey as a second factor (AAL2). Separate from the
    # `passkey` method, which is a first factor (sign in without a password).
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          id: docker.localhost
          display_name: "Hub Prod-Local"
          origins:
            - http://auth.docker.localhost
            - http://account.docker.localhost

session:
  cookie:
    domain: .docker.localhost
    same_site: Lax
  lifespan: 720h

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  delivery_strategy: http
  http:
    request_config:
      url: http://hub-monolith:3000/email/kratos-courier
      method: POST
      body: file:///etc/config/kratos/courier-body.jsonnet
      headers:
        Content-Type: application/json

log:
  level: warning
  format: text
