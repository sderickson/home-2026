# Recipes' monolith (deployed separately, on the edge network). The compose
# service name resolves to every running color, so DNS discovery scrapes
# exactly the live containers.
scrape_configs:
  - job_name: recipes
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["recipes-monolith"]
        type: A
        port: 3002
        refresh_interval: 30s
    relabel_configs:
      - target_label: saf_app
        replacement: recipes
