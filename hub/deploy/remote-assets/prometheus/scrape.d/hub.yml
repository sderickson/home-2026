# Hub's monolith. The compose service name resolves to every running color
# (both during a blue-green overlap), so DNS discovery scrapes exactly the
# live containers.
scrape_configs:
  - job_name: hub
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["hub-monolith"]
        type: A
        port: 3001
        refresh_interval: 30s
    relabel_configs:
      - target_label: saf_app
        replacement: hub
