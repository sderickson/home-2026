# Per-host Alertmanager (platform deploy). Prometheus sends it alerts from
# prometheus/rules/; it routes on saf_app (the app, or "host").
#
# Secrets are files on the server in /opt/alertmanager/secrets/ (mounted
# read-only), never in this repo. A missing file only makes that one
# integration fail to send; the rest still deliver.
#   hub-ops-token      ops token with only the ops:alerts-ingest scope
#                      (mint on hub's admin Ops tokens page)
#   slack-webhook-url  Slack incoming webhook URL
#
# Email to site admins is sent by each app (batched, rate limited), not here.
# No external dead man's switch yet: planned for a separate monitoring
# machine. To add one, route the Watchdog to a webhook_configs receiver with
# url_file pointing at a heartbeat ping URL (repeat_interval 1m).
route:
  receiver: hub
  group_by: [saf_app, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The Watchdog goes to hub's webhook every 5 minutes, proving delivery and its token
    # work (the digest's pipeline_last_seen_at); never to Slack.
    - matchers: ['alertname="Watchdog"']
      receiver: hub-watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
    # Hub is the platform app, so host alerts go to it too. Products on this
    # host get their own route and receiver (their /ops/alerts/webhook).
    - matchers: ['saf_app=~"hub|host"']
      receiver: hub

# A critical alert silences the matching warning (e.g. disk 90% over 80%).
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [saf_app, alertname]

receivers:
  - name: hub
    webhook_configs:
      # Straight to the monolith over the edge network (no Caddy hop).
      - url: http://hub-monolith:3001/ops/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/hub-ops-token
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[{{ .CommonLabels.severity | toUpper }}]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.saf_app }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  - name: hub-watchdog
    webhook_configs:
      - url: http://hub-monolith:3001/ops/alerts/webhook
        send_resolved: false
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/hub-ops-token
