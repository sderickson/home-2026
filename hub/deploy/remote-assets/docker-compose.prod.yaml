# Platform deploy: the edge (Caddy), identity (Kratos), and hub. Products deploy
# separately (their own <product>/deploy) and join the `edge` network; each
# registers its routes into the edge's sites volume (`saf-deploy up` does this).
services:
  caddy:
    cap_add:
      - NET_ADMIN
    image: $CONTAINER_REGISTRY/sderickson-caddy:latest
    # Fixed name: product deploys register their routes with it (SAF_EDGE_CONTAINER).
    container_name: sderickson-edge
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - ./env.caddy
    environment:
      - DISABLE_VITE_DEV_SERVER=#
    volumes:
      - ./config:/etc/caddy/
      - caddy_sites:/etc/caddy/sites
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    restart: unless-stopped

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - /opt/kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

  kratos:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    env_file:
      - ./env.kratos.config
      - ./.env.kratos.secrets
    volumes:
      - /opt/kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos
    # On the edge network so product services reach its admin API (kratos:4434).
    networks:
      - default
      - edge
    restart: unless-stopped

  # ---- Metrics (per host). Not published: apps query Prometheus through
  # prom-label-proxy, which confines each app to its own series.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
    # On the edge network to scrape product services (<product>-monolith).
    networks:
      - default
      - edge
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - host_apt_metrics:/textfile:ro
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  # Host package updates for node-exporter's textfile collector: runs the
  # host's own `apt-get -s` (a simulation: no locks, no writes) against its
  # read-only root every hour. See host-apt/host-apt-metrics.sh.
  host-apt:
    image: busybox:1.37
    command: ["sh", "/host-apt-metrics.sh"]
    volumes:
      - /:/host:ro
      - ./host-apt/host-apt-metrics.sh:/host-apt-metrics.sh:ro
      - host_apt_metrics:/textfile
    # apt writes temp files while reading signed package lists; give it a
    # private tmpfs over the read-only host root's /tmp.
    tmpfs:
      - /host/tmp
    network_mode: none
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # Routes alerts (alertmanager/alertmanager.yml) to each app's
  # /ops/alerts/webhook, Slack, and the external heartbeat. Secrets are files
  # in /opt/alertmanager/secrets, readable by uid 65534 (nobody).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/conf/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager/conf:ro
      - /opt/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    deploy:
      resources:
        limits:
          memory: 64M
    # On the edge network to reach each app's webhook (<product>-monolith).
    networks:
      - default
      - edge
    restart: unless-stopped

  # Apps send X-Saf-App: <app>,host; every query gets saf_app=~"<app>|host"
  # injected, and only read endpoints are proxied (no admin APIs).
  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.11.1
    command:
      - -insecure-listen-address=0.0.0.0:8080
      - -upstream=http://prometheus:9090
      - -label=saf_app
      - -header-name=X-Saf-App
      - -header-uses-list-syntax
      - -enable-label-apis
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - default
      - edge
    restart: unless-stopped

networks:
  edge:
    name: sderickson-edge

volumes:
  # Names pinned to the original single-stack deploy's, so certificates carry over.
  caddy_data:
    name: home_caddy_data
  caddy_config:
    name: home_caddy_config
  # Product routes (<product>.Caddyfile), registered by each product's deploy.
  caddy_sites:
    name: sderickson-caddy-sites
  prometheus_data:
    name: sderickson-prometheus-data
  alertmanager_data:
    name: sderickson-alertmanager-data
  host_apt_metrics:
    name: sderickson-host-apt-metrics
