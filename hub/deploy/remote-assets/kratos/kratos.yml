version: v1.3.1

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc

serve:
  public:
    base_url: https://kratos.scotterickson.info/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: https://auth.scotterickson.info/

  # Permit return_to from any HTTPS app on this domain (wildcard does not match apex).
  allowed_return_urls:
    - https://scotterickson.info/
    - https://*.scotterickson.info/

  flows:
    registration:
      enabled: true
      style: unified
      ui_url: https://auth.scotterickson.info/registration

    login:
      ui_url: https://auth.scotterickson.info/login

    recovery:
      enabled: true
      ui_url: https://auth.scotterickson.info/recovery

    settings:
      ui_url: https://account.scotterickson.info/settings

    logout:
      after:
        default_browser_return_url: https://auth.scotterickson.info/

    verification:
      enabled: true
      ui_url: https://auth.scotterickson.info/verification
      use: code

  methods:
    password:
      enabled: true
    # Off: passkeys are a second factor here (webauthn below), not a
    # password replacement. Both methods drive the same browser prompt.
    passkey:
      enabled: false
    totp:
      enabled: true
      config:
        issuer: Scott's Home Page
    # Security key / passkey as a second factor (AAL2). Separate from the
    # `passkey` method, which is a first factor (sign in without a password).
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          id: scotterickson.info
          display_name: "Scott's Home Page"
          origins:
            - https://auth.scotterickson.info
            - https://account.scotterickson.info

session:
  cookie:
    domain: .scotterickson.info
    same_site: Lax
  lifespan: 720h

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  delivery_strategy: http
  http:
    request_config:
      url: http://hub-monolith:3000/email/kratos-courier
      method: POST
      body: file:///etc/config/kratos/courier-body.jsonnet
      headers:
        Content-Type: application/json

log:
  level: warning
  format: text
