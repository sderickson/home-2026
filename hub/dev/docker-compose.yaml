services:
  caddy:
    image: caddy:2.11.2
    ports:
      - 80:80
    volumes:
      - ./caddy-config:/etc/caddy/
      # Satellite products' routes (notebook): their dev stacks include this one
      # and point SAF_DEV_SITES at their own sites/.
      - ${SAF_DEV_SITES:-./sites}:/etc/caddy-sites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hub-clients

  # Installs node_modules into the shared volume when the lockfile changed
  # (no image rebuild needed), then exits. The Node services wait for it.
  deps:
    image: sderickson-hub-dev-node:latest
    build:
      context: ../..
      dockerfile: ./hub/dev/builds/node/Dockerfile
    command:
      - node
      - --experimental-strip-types
      - --disable-warning=ExperimentalWarning
      - /app/saflib/docker/dev/install-node-modules.ts
    volumes: &node-volumes
      # Source is bind-mounted; node_modules stays in Linux-only named volumes
      # (the host's macOS builds would shadow them otherwise). saflib's own
      # node_modules is for developing it standalone, so it's masked too.
      - ../..:/app
      - node_modules:/app/node_modules
      - saflib_node_modules:/app/saflib/node_modules
      - npm_cache:/root/.npm

  hub-clients:
    image: sderickson-hub-dev-node:latest
    depends_on:
      deps:
        condition: service_completed_successfully
    working_dir: /app/hub/clients/build
    environment:
      - CLIENT_SUBDOMAINS=,app,auth,account,admin
      - DOMAIN=docker.localhost
      - DEPLOYMENT_NAME=${DEPLOYMENT_NAME}
      - PROTOCOL=${PROTOCOL}
      - SERVICE_SUBDOMAINS=hub
      - TZ=${TZ}
    volumes: *node-volumes
    command: npm run dev

  monolith:
    image: sderickson-hub-dev-node:latest
    depends_on:
      deps:
        condition: service_completed_successfully
    working_dir: /app/hub/service/monolith
    # Restarts when any file it imports changes (service code and saflib alike).
    command:
      - node
      - --watch
      - --experimental-strip-types
      - --disable-warning=ExperimentalWarning
      - ./run.ts
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
      - saflib_node_modules:/app/saflib/node_modules
      - npm_cache:/root/.npm
      - identity_http_cache:/app/saflib/identity/identity-http/data
    env_file:
      - ./env.dev

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      # Persists SQLite (identities, sessions, flows) across container restarts
      - ./kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

  kratos:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    env_file:
      - ./env.kratos.config
    volumes:
      - ./kratos/data:/var/lib/sqlite
      - ./kratos:/etc/config/kratos

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    hostname: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite-blob --blobHost 0.0.0.0 --loose"

volumes:
  caddy_data:
  caddy_config:
  node_modules:
  saflib_node_modules:
  npm_cache:
  identity_http_cache:
